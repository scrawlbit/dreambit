name: CI (editor standalone .NET 8)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DreamBit.Studio.slnx

      - name: Build
        run: dotnet build DreamBit.Studio.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DreamBit.Engine.Tests/DreamBit.Engine.Tests.csproj -c Release --no-build
